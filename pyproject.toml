[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcdebug"
version = "2.0.0"
description = "Revan Cool Debugger - Cross-platform (Windows, macOS, Linux) CLI & Web Workbench security auditor for Roblox Studio (600,000 flaws) and Websites (150,000 flaws)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Revan" }
]
keywords = ["roblox", "luau", "website", "web-security", "xss", "owasp", "audit", "mcp", "debugger", "studio", "windows", "macos"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/roulettegun/rcdebug"
Repository = "https://github.com/roulettegun/rcdebug.git"
Issues = "https://github.com/roulettegun/rcdebug/issues"
Releases = "https://github.com/roulettegun/rcdebug/releases"

[project.scripts]
rcdebug = "rcdebug.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rcdebug*"]

[tool.setuptools.package-data]
rcdebug = ["data/*.txt", "data/*.txt.gz", "data/*.json"]
